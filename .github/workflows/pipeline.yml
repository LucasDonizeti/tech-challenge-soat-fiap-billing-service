name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "develop" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: billing-service
  EKS_CLUSTER_NAME: oficina-cluster
  HELM_RELEASE_NAME: billing-service
  HELM_CHART_PATH: k8s
  K8S_NAMESPACE: default

jobs:
  # JOB 1 — Build + Testes
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build e testes com Maven
        run: mvn -B verify --file pom.xml
        working-directory: ./billing

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: billing/target/*.jar
          retention-days: 1

  # JOB 2 — Build e push da imagem Docker para o ECR
  push-image-ecr:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: billing/target

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag da imagem
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Tag da imagem: ${SHORT_SHA}"

      - name: Build e push da imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./billing
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # JOB 3 — Deploy com Helm no EKS
  deploy:
    name: Deploy Helm → EKS
    runs-on: ubuntu-latest
    needs: [ push-image-ecr ]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl para o EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Criar/atualizar imagePullSecret do ECR
        env:
          ECR_REGISTRY: ${{ needs.push-image-ecr.outputs.ecr_registry }}
        run: |
          ECR_PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          kubectl create secret docker-registry aws-ecr-secret \
            --docker-server=$ECR_REGISTRY \
            --docker-username=AWS \
            --docker-password=$ECR_PASSWORD \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade --install
        env:
          ECR_REGISTRY: ${{ needs.push-image-ecr.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.push-image-ecr.outputs.image_tag }}
          MONGODB_ATLAS_URI: ${{ secrets.MONGODB_ATLAS_URI }}
        run: |
          if [ -z "$MONGODB_ATLAS_URI" ]; then
            echo "::error::The MONGODB_ATLAS_URI GitHub Actions secret must be configured."
            exit 1
          fi

          MONGODB_URI_FILE=$(mktemp)
          trap 'rm -f "$MONGODB_URI_FILE"' EXIT
          printf '%s' "$MONGODB_ATLAS_URI" > "$MONGODB_URI_FILE"

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./${{ env.HELM_CHART_PATH }} \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            -f ./${{ env.HELM_CHART_PATH }}/values-prod.yaml \
            --set image.repository=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }} \
            --set image.tag=$IMAGE_TAG \
            --set-file secret.MONGODB_URI="$MONGODB_URI_FILE" \
            --set secret.JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --set secret.SECURITY_USER_NAME="${{ secrets.SECURITY_USER_NAME }}" \
            --set secret.SECURITY_USER_PASSWORD="${{ secrets.SECURITY_USER_PASSWORD }}" \
            --set secret.NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --rollback-on-failure \
            --timeout 10m \
            --wait

      - name: Verificar rollout do deployment
        run: |
          kubectl rollout status deployment/billing-service \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --timeout=5m
